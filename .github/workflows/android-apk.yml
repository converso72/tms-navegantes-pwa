name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Required by Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read App Version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Los-Navegantes-TMS-v${{ steps.pkg.outputs.version }}.apk"

      - name: Upload Versioned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Los-Navegantes-TMS-v${{ steps.pkg.outputs.version }}-APK
          path: android/app/build/outputs/apk/debug/Los-Navegantes-TMS-v${{ steps.pkg.outputs.version }}.apk
